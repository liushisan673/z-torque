[alembic]
script_location = alembic
prepend_sys_path = .
# Plugin-owned tables (scheme b, v1.3 §5.6): the migration file lives inside the
# plugin directory, but the kernel's single migration chain still executes it
# (the kernel stays the only DDL executor; plugins have no DDL rights at runtime).
# %(here)s is the directory of this ini file (repo root), so both paths stay absolute
# regardless of the CLI working directory. Do not drop the alembic/ prefix.
version_locations = %(here)s/alembic/versions %(here)s/app/builtin_plugins/audit_export_archive/migrations
# Keep this empty: alembic/env.py resolves the URL (injected > DATABASE_URL > this).
# A value here would win over the env var and silently target the wrong database.
# NOTE: keep this file ASCII-only -- ConfigParser reads it with the OS locale codec.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
