[project]
name = "z-torque"
version = "0.1.0"
description = "Z-Torque Community Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.37",
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "PyJWT==2.10.1",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "sqlglot==26.8.0",
  # db_executor 在模块级 import pg8000（连接器数据库执行器的 postgres 驱动），
  # 属于运行时硬依赖而非测试依赖，故放在核心依赖里
  "pg8000==1.31.5",
  "jsonschema==4.23.0",
  "PyYAML==6.0.2",
  "uuid6==2025.0.1",
  "pypdf==6.21.1",
  "openpyxl==3.1.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.3", "httpx==0.28.1"]
# 静态门禁工具单独成组：CI 的 python-static job 用它，运行时不依赖
lint = ["ruff==0.17.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# 只扫源码，不扫构建产物与本地数据目录
extend-exclude = ["data", "console", "md-skills", ".venv", "docs"]

[tool.ruff.lint]
# 门禁口径（2026-10-26 定版）：只收「真实缺陷」类规则，不含纯风格偏好。
#   F      pyflakes：未定义名 / 未使用导入与变量 / 重复定义
#   E4/E7/E9  pycodestyle 的语法与缩进类（不含 E501 行长，行长交给格式化）
#   I      isort：导入分区与排序
#   B      flake8-bugbear：可疑逻辑（可变默认值、except 裸 raise、无用表达式等）
#   ASYNC  flake8-async：异步函数里误用阻塞调用
# ignore 清单是「本项目明确接受的写法」，每条都有原因，不得随手扩充：
#   E402  按需延迟导入（conftest 必须先设环境变量再 import app.*）
#   E701/E702  `if x: return`、`with a: b()` 这类紧凑单行，测试与装配代码里大量使用
#   B008  FastAPI 依赖注入惯例：`Depends(...)`/`Query(...)` 必须写在默认参数位
#   B904  except 内 `raise ApiError(...)` 不带 from：错误链由 ApiError 自己承载上下文
#   B905  zip() 未显式 strict：两侧长度由调用点自行保证，加 strict 会改变既有行为
#   B017  `pytest.raises(Exception)`：少数用例专门断言「任意异常都要被兜住」
#   ASYNC109  `async def` 带 timeout 参数：本项目的 sandbox/skill 接口签名由契约固定
select = ["F", "E4", "E7", "E9", "I", "B", "ASYNC"]
ignore = ["E402", "E701", "E702", "B008", "B904", "B905", "B017", "ASYNC109"]

[tool.ruff.lint.isort]
# 项目自有包在 app/ 下，第三方在 site-packages：分开成独立分区
known-first-party = ["app", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
# 迁移脚本里的 `x = op.create_table(...)` 等是 alembic DSL，F841 会误报
"alembic/versions/*" = ["F841"]
# 内核 Port 契约文件已冻结（改内容=改契约）：不为了 import 排序去格式化它们，
# 因此这里豁免 I001。新增契约文件不在此列，仍受门禁约束。
"app/kernel/ports/__init__.py" = ["I001"]
"app/kernel/ports/model_selector.py" = ["I001"]
"app/kernel/ports/specs.py" = ["I001"]
